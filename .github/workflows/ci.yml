        restore-keys: |
          ubuntu-bench-${{ env.CACHE_VERSION }}-

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          clang \
          cmake \
          python3 \
          libtbb-dev \
          valgrind \
          cppcheck \
          libnuma-dev \
          sccache

    - name: Configure for benchmarks
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLOGGING_BACKEND=LOGURU \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=ON \
          -DMEMORY_ENABLE_BENCHMARK=ON \
          -DLOGGING_ENABLE_BENCHMARK=ON \
          -DVECTORIZATION_ENABLE_BENCHMARK=ON \
          -DPARALLEL_ENABLE_BENCHMARK=ON \
          -DPROFILER_ENABLE_BENCHMARK=ON \
          -DCORE_ENABLE_LTO=ON \
          -DMEMORY_ENABLE_LTO=ON \
          -DLOGGING_ENABLE_LTO=ON \
          -DVECTORIZATION_ENABLE_LTO=ON \
          -DPARALLEL_ENABLE_LTO=ON \
          -DPROFILER_ENABLE_LTO=ON \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON

    - name: Build
      run: cmake --build build -j 2

    - name: Run Benchmarks
      working-directory: ${{ github.workspace }}/build
      run: |
        # Run benchmarks and save results
        ctest -R ".*[Bb]enchmark.*" --output-on-failure || true

    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: |
          build/Testing/Temporary/LastTest.log
          build/**/*benchmark*.log

  # ============================================================================
  # Sccache Performance Testing - Baseline (Without Sccache)
  # ============================================================================
  # Tests build performance without sccache for baseline comparison
  # Runs on Ubuntu, macOS, and Windows with consistent configuration
  # ============================================================================
  sccache-baseline-tests:
    name: "Sccache Baseline - ${{ matrix.os }} - ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu C++17 Release - Baseline (No Sccache)"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          - name: "macOS C++17 Release - Baseline (No Sccache)"
            os: macos-latest
            build_type: Release
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/Library/Caches

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ matrix.cache_path }}
          build/ThirdParty
        key: ${{ runner.os }}-sccache-baseline-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'ThirdParty/**') }}
        restore-keys: |
          ${{ runner.os }}-sccache-baseline-${{ env.CACHE_VERSION }}-

    # ===== Ubuntu Dependencies =====
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    # ===== macOS Dependencies =====
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x .github/workflows/install/install-deps-macos.sh
        ./.github/workflows/install/install-deps-macos.sh --with-tbb

    # ===== CMake Configuration (Baseline - No Sccache) =====
    - name: Configure CMake (Ubuntu/macOS - Baseline)
      if: runner.os != 'Windows'
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DLOGGING_BACKEND=LOGURU \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF

    # ===== Build and Test (Baseline - No Sccache) =====
    - name: Record build start time (Baseline)
      shell: bash
      run: |
        echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: Build (Baseline - No Sccache)
      run: cmake --build build --config ${{ matrix.build_type }} -j 2

    - name: Record build end time (Baseline)
      shell: bash
      run: |
        echo "BUILD_END_TIME=$(date +%s)" >> $GITHUB_ENV
        BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
        echo "BUILD_DURATION_BASELINE=$BUILD_DURATION" >> $GITHUB_ENV

    - name: Run Tests (Baseline)
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }} -j 2

    - name: Report Baseline Build Metrics
      shell: bash
      run: |
        echo "=== Sccache Baseline Build Metrics ==="
        echo "Platform: ${{ runner.os }}"
        echo "Build Type: ${{ matrix.build_type }}"
        echo "C++ Standard: ${{ matrix.cxx_std }}"
        echo "Sccache Enabled: NO (Baseline)"
        echo "Build Duration: ${{ env.BUILD_DURATION_BASELINE }} seconds"
        echo ""

  # ============================================================================
  # Sccache Performance Testing - With Sccache Enabled
  # ============================================================================
  # Tests build performance with sccache enabled for comparison
  # Uses CMAKE_CXX_COMPILER_LAUNCHER to enable sccache
  # ============================================================================
  sccache-enabled-tests:
    name: "Sccache Enabled - ${{ matrix.os }} - ${{ matrix.build_type }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu C++17 Release - Sccache Enabled"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          - name: "macOS C++17 Release - Sccache Enabled"
            os: macos-latest
            build_type: Release
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/Library/Caches

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ matrix.cache_path }}
          build/ThirdParty
        key: ${{ runner.os }}-sccache-enabled-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'ThirdParty/**') }}
        restore-keys: |
          ${{ runner.os }}-sccache-enabled-${{ env.CACHE_VERSION }}-

    - name: Cache sccache directory
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/sccache
          ~/Library/Caches/sccache
        key: ${{ runner.os }}-sccache-${{ env.CACHE_VERSION }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-sccache-${{ env.CACHE_VERSION }}-

    # ===== Ubuntu Dependencies =====
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    # ===== macOS Dependencies =====
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x .github/workflows/install/install-deps-macos.sh
        ./.github/workflows/install/install-deps-macos.sh --with-tbb

    # ===== Windows Dependencies =====
    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & .\.github\workflows\install\install-deps-windows.ps1

    # ===== Install Sccache =====
    - name: Install sccache (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        echo "=== Installing sccache on Ubuntu ==="
        mkdir -p ~/.local/bin
        curl -L https://github.com/mozilla/sccache/releases/download/v${{ env.SCCACHE_VERSION }}/sccache-v${{ env.SCCACHE_VERSION }}-x86_64-unknown-linux-musl.tar.gz \
          | tar xz -C ~/.local/bin --strip-components=1
        chmod +x ~/.local/bin/sccache
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        sccache --version

    - name: Install sccache (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "=== Installing sccache on macOS ==="
        mkdir -p ~/.local/bin
        curl -L https://github.com/mozilla/sccache/releases/download/v${{ env.SCCACHE_VERSION }}/sccache-v${{ env.SCCACHE_VERSION }}-x86_64-apple-darwin.tar.gz \
          | tar xz -C ~/.local/bin --strip-components=1
        chmod +x ~/.local/bin/sccache
        echo "$HOME/.local/bin" >> $GITHUB_PATH
        sccache --version

    # ===== CMake Configuration (With Sccache) =====
    - name: Configure CMake (Ubuntu/macOS - With Sccache)
      if: runner.os != 'Windows'
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          -DBUILD_TESTING=ON

    - name: Configure CMake (Windows - With Sccache)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build `
          -C .github/cmake/configure_cache.cmake `
          -S . `
          -G "${{ matrix.generator }}" `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_C_COMPILER=${{ matrix.compiler_c }} `
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler_cxx }} `
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }} `
          -DLOGGING_BACKEND=${{ matrix.logging_backend }} `
          -DBUILD_TESTING=ON `
          -DCORE_ENABLE_BENCHMARK=OFF `
          -DMEMORY_ENABLE_BENCHMARK=OFF `
          -DLOGGING_ENABLE_BENCHMARK=OFF `
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF `
          -DPARALLEL_ENABLE_BENCHMARK=OFF `
          -DPROFILER_ENABLE_BENCHMARK=OFF `
          -DMEMORY_ENABLE_CUDA=${{ matrix.cuda_enabled }}

    # ===== Build and Test (With Sccache) =====
    - name: Record build start time (Sccache)
      shell: bash
      run: |
        echo "BUILD_START_TIME=$(date +%s)" >> $GITHUB_ENV

    - name: Build (With Sccache)
      run: cmake --build build --config ${{ matrix.build_type }} -j 2

    - name: Record build end time (Sccache)
      shell: bash
      run: |
        echo "BUILD_END_TIME=$(date +%s)" >> $GITHUB_ENV
        BUILD_DURATION=$((BUILD_END_TIME - BUILD_START_TIME))
        echo "BUILD_DURATION_SCCACHE=$BUILD_DURATION" >> $GITHUB_ENV

    - name: Run Tests (With Sccache)
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --build-config ${{ matrix.build_type }} -j 2

    - name: Report Sccache Build Metrics
      shell: bash
      run: |
        echo "=== Sccache Enabled Build Metrics ==="
        echo "Platform: ${{ runner.os }}"
        echo "Build Type: ${{ matrix.build_type }}"
        echo "C++ Standard: ${{ matrix.cxx_std }}"
        echo "Sccache Enabled: YES"
        echo "Build Duration: ${{ env.BUILD_DURATION_SCCACHE }} seconds"
        echo ""
        sccache --show-stats || echo "Sccache stats unavailable"

  # ============================================================================
  # Code Coverage Testing - Clang
  # ============================================================================
  clang-coverage-tests:
    name: Clang Coverage Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu Clang Coverage - C++17"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: NATIVE
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      shell: bash
      run: |
        bash .github/workflows/install/install-deps-ubuntu.sh --with-tbb=OFF --with-cuda=OFF

    - name: Install Clang
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang llvm

    - name: Verify Clang installation
      shell: bash
      run: |
        clang --version
        llvm-cov --version

    - name: Install coverage tool package
      shell: bash
      run: |
        pip install -e "Tools/coverage[test]"

    - name: Run coverage tool test suite
      shell: bash
      run: |
        python -m pytest Tools/coverage/tests/ -v

    - name: Run coverage build
      shell: bash
      run: |
        # Configure CMake with coverage enabled
        cmake -B build \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=NATIVE \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_COVERAGE=ON \
          -DMEMORY_ENABLE_COVERAGE=ON \
          -DLOGGING_ENABLE_COVERAGE=ON \
          -DVECTORIZATION_ENABLE_COVERAGE=ON \
          -DPARALLEL_ENABLE_COVERAGE=ON \
          -DPROFILER_ENABLE_COVERAGE=ON \
          -DMEMORY_ENABLE_CUDA=OFF

        # Build
        cmake --build build -j 2

        # Run tests
        ctest --test-dir build --output-on-failure -j 2

        # Run coverage analysis
        coverage-tool --build=build

    - name: Verify JSON report generation
      shell: bash
      run: |
        if [ ! -f "build/coverage_report/coverage_summary.json" ]; then
          echo "Error: JSON coverage report not generated"
          exit 1
        fi
        echo "✓ JSON coverage report generated successfully"

    - name: Verify HTML report generation
      shell: bash
      run: |
        if [ ! -f "build/coverage_report/html/index.html" ]; then
          echo "Error: HTML coverage report not generated"
          exit 1
        fi
        echo "✓ HTML coverage report generated successfully"

    - name: Display coverage metrics
      shell: bash
      run: |
        python -c "
        import json
        with open('build/coverage_report/coverage_summary.json') as f:
            data = json.load(f)
            line_cov = data['summary']['line_coverage']
            func_cov = data['summary']['function_coverage']
            print('=== Coverage Metrics ===')
            print(f'Line Coverage: {line_cov[\"covered\"]}/{line_cov[\"total\"]} ({line_cov[\"percent\"]}%)')
            print(f'Function Coverage: {func_cov[\"covered\"]}/{func_cov[\"total\"]} ({func_cov[\"percent\"]}%)')
            print(f'Files Analyzed: {len(data[\"files\"])}')
        "

    - name: Generate LCOV report for Codecov
      shell: bash
      run: |
        # Convert JSON coverage to LCOV format for Codecov
        if [ -f "build/coverage_report/coverage.lcov" ]; then
          echo "✓ LCOV report already exists"
        else
          echo "Note: LCOV report will be generated by coverage tools"
        fi

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        files: ./build/coverage_report/coverage.lcov
        flags: clang-coverage
        name: clang-coverage-report
        fail_ci_if_error: false
        verbose: true
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    - name: Upload coverage artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: clang-coverage-reports
        path: build/coverage_report/
        retention-days: 30

  # ============================================================================
  # Windows build CLI smoke test (no compile — verifies Python entrypoints)
  # ============================================================================
  windows-cli-smoke:
    name: Windows — build CLI smoke
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Smoke-test Scripts/setup.py --help
      shell: pwsh
      run: |
        python Scripts\setup.py --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Smoke-test Scripts/setup_bazel.py --help
      shell: pwsh
      run: |
        python Scripts\setup_bazel.py --help
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ============================================================================
  # Bazel Build Matrix — default config
  # Real `bazel build`/`bazel test` runs via Scripts/setup_bazel.py, mirroring the
  # CMake build-matrix job above but through the Bazel build system. Windows is not
  # included here yet (only smoke-tested above via --help) — the Bazel setup has not
  # been verified end-to-end on Windows.
  # ============================================================================
  bazel-build-matrix:
    name: "Bazel - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-${{ runner.os }}-default-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (default config)
      working-directory: Scripts
      run: python3 setup_bazel.py config.build.test

  # ============================================================================
  # Bazel TBB Tests
  # Exercises --config=tbb specifically: the Bazel-side MEMORY_HAS_TBB define was
  # historically not paired with an actual @tbb dep (see Docs/BAZEL_USER_GUIDE.md's
  # Known Gaps section) — this job is the regression guard for that class of bug.
  # ============================================================================
  bazel-tbb-tests:
    name: "Bazel TBB - ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-${{ runner.os }}-tbb-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (TBB)
      working-directory: Scripts
      run: python3 setup_bazel.py config.build.test.tbb

  # ============================================================================
  # Bazel Project + Backend Matrix
  # Mirrors the CMake project-flag-backend-tests job's project/backend coverage via
  # Scripts/setup_bazel.py --project.NAME. XSIGMA_ENABLE_EXTERNAL has no Bazel
  # equivalent (setup_bazel.py warns and no-ops on the "external" token -- see
  # Docs/BAZEL_USER_GUIDE.md), so each project/backend combination appears once
  # here instead of twice.
  # ============================================================================
  bazel-project-flag-backend-tests:
    name: "Bazel Project Matrix - ${{ matrix.project }} - ${{ matrix.backend_label }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: core
            backend_label: default
            extra_config: ""
          - project: memory
            backend_label: default
            extra_config: ""
          - project: logging
            backend_label: LOGURU
            extra_config: logging_loguru
          - project: logging
            backend_label: NATIVE
            extra_config: logging_native
          - project: logging
            backend_label: GLOG
            extra_config: logging_glog
          - project: parallel
            backend_label: std
            extra_config: parallel.std
          - project: parallel
            backend_label: openmp
            extra_config: parallel.openmp
          - project: parallel
            backend_label: tbb
            extra_config: parallel.tbb
          - project: profiler
            backend_label: ITT
            extra_config: profiler_itt
          - project: profiler
            backend_label: KINETO
            extra_config: profiler_kineto
          - project: logging
            backend_label: SPDLOG
            extra_config: logging_spdlog
          - project: vectorization
            backend_label: default
            extra_config: ""
          - project: models
            backend_label: default
            extra_config: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-project-${{ matrix.project }}-${{ matrix.backend_label }}-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Install OpenMP (Bazel openmp backend)
      if: matrix.backend_label == 'openmp'
      run: sudo apt-get update && sudo apt-get install -y libomp-dev

    - name: Bazel build + test (${{ matrix.project }} / ${{ matrix.backend_label }})
      working-directory: Scripts
      shell: bash
      run: |
        if [ -n "${{ matrix.extra_config }}" ]; then
          python3 setup_bazel.py config.build.test.${{ matrix.extra_config }} --project.${{ matrix.project }}
        else
          python3 setup_bazel.py config.build.test --project.${{ matrix.project }}
        fi

  # ============================================================================
  # Bazel Vectorization SIMD Backend Matrix
  # Mirrors the CMake vectorization-simd-backend-tests job. This is the direct
  # regression guard for the ARM-host select() ambiguity bug found in this project's
  # Bazel/CMake alignment work: on aarch64, an explicit --define=vectorization_type=X
  # for any tier except neon used to fail analysis entirely (see Docs/BAZEL_USER_GUIDE.md).
  # ============================================================================
  bazel-vectorization-simd-tests:
    name: "Bazel Vectorization ${{ matrix.vectorization_type }} — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - vectorization_type: no
            os: ubuntu-latest
          - vectorization_type: sse
            os: ubuntu-latest
          - vectorization_type: avx
            os: ubuntu-latest
          - vectorization_type: avx2
            os: ubuntu-latest
          - vectorization_type: avx512
            os: ubuntu-latest
          - vectorization_type: neon
            os: ubuntu-24.04-arm
          - vectorization_type: sve
            os: ubuntu-24.04-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-vec-simd-${{ matrix.vectorization_type }}-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    # AVX-512 still compiles on ubuntu-latest. Hosted runners often list
    # avx512f in cpuinfo but SIGILL on the instructions; skip the test run
    # unless Scripts/helpers/cpu_isa.py reports avx512f (same as CMake).
    - name: Bazel build + test (Vectorization ${{ matrix.vectorization_type }})
      working-directory: Scripts
      run: |
        if [ "${{ matrix.vectorization_type }}" = "avx512" ]; then
          if ! python3 "${{ github.workspace }}/Scripts/helpers/cpu_isa.py" avx512; then
            echo "AVX-512 compile-only: this CPU has no usable avx512f."
            python3 setup_bazel.py config.build.avx512 --project.vectorization
            exit 0
          fi
        fi
        python3 setup_bazel.py config.build.test.${{ matrix.vectorization_type }} --project.vectorization

  # ============================================================================
  # Bazel Metal Tests — macOS only
  # Real Metal GPU dispatch through both Library/Memory and Library/Vectorization's
  # independent GPU backends. Runs on real Metal hardware (macos-latest runners have
  # a GPU), unlike every other job here which only exercises CPU paths.
  # ============================================================================
  bazel-metal-tests:
    name: "Bazel Metal - macOS"
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-macos-metal-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (Metal)
      working-directory: Scripts
      run: python3 setup_bazel.py config.build.test.metal

  # ============================================================================
  # CMake GPU backends — CUDA / HIP / Metal
  # Hosted runners have no NVIDIA/AMD GPU. CUDA (Linux) and HIP jobs compile
  # the GPU path and run the CPU test suite; device tests GTEST_SKIP when
  # cudaGetDeviceCount is 0. CUDA (Windows) is build-only (see matrix comment
  # below — no driver-less nvcuda.dll stub exists for Windows). Metal runs on
  # real macOS GPU hardware.
  # ============================================================================
  cmake-gpu-backend-tests:
    name: "CMake GPU - ${{ matrix.backend }} — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: cuda
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_GPU_BACKEND=cuda -DVECTORIZATION_GPU_BACKEND=cuda"
          # Windows CUDA is build-only: NVIDIA ships a driver stub (libcuda.so)
          # for Linux CI but not an equivalent nvcuda.dll for Windows, so a
          # CUDA-linked .exe compiles/links fine here but cannot load on a
          # driver-less runner. This still catches real compile/link
          # regressions (e.g. windows.h macro pollution via NVTX headers,
          # missing CUPTI runtime DLL staging) without a flaky test step.
          - backend: cuda
            os: windows-latest
            extra_cmake: "-DMEMORY_GPU_BACKEND=cuda -DVECTORIZATION_GPU_BACKEND=cuda"
          - backend: hip
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_GPU_BACKEND=hip -DVECTORIZATION_GPU_BACKEND=hip -DCMAKE_HIP_ARCHITECTURES=gfx90a -DPROJECT_HIP_ARCH_OPTIONS=gfx90a"
          - backend: metal
            os: macos-latest
            extra_cmake: "-DMEMORY_GPU_BACKEND=metal -DVECTORIZATION_GPU_BACKEND=metal"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        extra=""
        if [ "${{ matrix.backend }}" = "cuda" ]; then extra="--with-cuda"; fi
        if [ "${{ matrix.backend }}" = "hip" ]; then extra="--with-hip"; fi
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb $extra

    - name: Select GCC 13 headers for Clang CUDA
      if: runner.os == 'Linux' && matrix.backend == 'cuda'
      shell: bash
      run: |
        # Clang 18 selects the newest installed GCC by default. GCC 14's
        # <limits> exposes __float128, which is unsupported on CUDA targets.
        # Keep host C++ and CUDA compilation on the same compatible headers.
        sudo apt-get install -y g++-13
        gcc_install_dir="$(dirname "$(g++-13 -print-libgcc-file-name)")"
        echo "CXXFLAGS=${CXXFLAGS:+$CXXFLAGS }--gcc-install-dir=$gcc_install_dir" >> "$GITHUB_ENV"
        echo "CUDAFLAGS=${CUDAFLAGS:+$CUDAFLAGS }--gcc-install-dir=$gcc_install_dir" >> "$GITHUB_ENV"

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x .github/workflows/install/install-deps-macos.sh
        ./.github/workflows/install/install-deps-macos.sh --with-tbb

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        & .\.github\workflows\install\install-deps-windows.ps1 -WithCuda

    - name: Setup macOS linker environment
      if: runner.os == 'macOS'
      run: |
        echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    - name: Configure (CMake ${{ matrix.backend }})
      shell: bash
      run: |
        # TBB is tested separately on Windows (see build-matrix); this job's
        # Windows install step doesn't provision it.
        tbb_flags="-DPARALLEL_ENABLE_TBB=ON -DMEMORY_ENABLE_TBB=ON"
        if [ "${{ runner.os }}" = "Windows" ]; then
          tbb_flags="-DPARALLEL_ENABLE_TBB=OFF -DMEMORY_ENABLE_TBB=OFF"
        fi
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=NATIVE \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          $tbb_flags \
          ${{ matrix.extra_cmake }}

    - name: Build
      run: cmake --build build -j 2

    - name: Test
      if: runner.os != 'Windows'
      working-directory: ${{ github.workspace }}/build
      run: |
        # Toolkit install has no NVIDIA driver; DT_NEEDED libcuda.so.1 must
        # resolve to the CUDA stub (often under targets/.../lib/stubs, and
        # often named only libcuda.so until a .so.1 symlink is created).
        stubs=""
        for d in \
            /usr/local/cuda/lib64/stubs \
            /usr/local/cuda/targets/x86_64-linux/lib/stubs \
            /usr/local/cuda-12.6/lib64/stubs \
            /usr/local/cuda-12.6/targets/x86_64-linux/lib/stubs; do
          if [ -e "${d}/libcuda.so" ] || [ -e "${d}/libcuda.so.1" ]; then
            stubs="${d}"
            break
          fi
        done
        if [ -n "${stubs}" ]; then
          if [ -e "${stubs}/libcuda.so" ] && [ ! -e "${stubs}/libcuda.so.1" ]; then
            ln -sf libcuda.so "${stubs}/libcuda.so.1" 2>/dev/null \
              || sudo ln -sf libcuda.so "${stubs}/libcuda.so.1"
          fi
          export LD_LIBRARY_PATH="${stubs}:${LD_LIBRARY_PATH:-}"
        fi
        rocm_lib="${ROCM_PATH:-${HIP_PATH:-/opt/rocm}}/lib"
        if [ -d "${rocm_lib}" ]; then
          export LD_LIBRARY_PATH="${rocm_lib}:${LD_LIBRARY_PATH:-}"
        fi
        if [ -f "${{ github.workspace }}/ThirdParty/svml/unix/lib/libintlc.so.5" ]; then
          export LD_LIBRARY_PATH="${{ github.workspace }}/ThirdParty/svml/unix/lib:${LD_LIBRARY_PATH:-}"
        fi
        ctest --output-on-failure -j 2

    - name: Upload GPU CMake logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: cmake-gpu-${{ matrix.backend }}-logs
        path: |
          build/Testing/Temporary/LastTest.log
          build/**/*.log

  # ============================================================================
  # Bazel CUDA / HIP (compile + test; device tests skip without a GPU)
  # ============================================================================
  bazel-cuda-tests:
    name: "Bazel CUDA - Ubuntu"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install CUDA toolkit
      run: |
        chmod +x .github/workflows/install/install-cuda-ubuntu.sh
        .github/workflows/install/install-cuda-ubuntu.sh

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-ubuntu-cuda-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (CUDA)
      working-directory: Scripts
      env:
        LD_LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/targets/x86_64-linux/lib/stubs:${{ env.LD_LIBRARY_PATH }}
      run: python3 setup_bazel.py config.build.test.cuda

  bazel-hip-tests:
    name: "Bazel HIP - Ubuntu"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install HIP toolkit
      run: |
        chmod +x .github/workflows/install/install-hip-ubuntu.sh
        .github/workflows/install/install-hip-ubuntu.sh

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-ubuntu-hip-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (HIP)
      working-directory: Scripts
      run: python3 setup_bazel.py config.build.test.hip

  # ============================================================================
  # CMake Metal is covered by cmake-gpu-backend-tests (macos). This job is the
  # CMake counterpart to bazel-metal-tests, scoped to Memory+Vectorization
  # packet-size / SLEEF / Accelerate / shared / NUMA / memkind / mimalloc-off.
  # ============================================================================
  feature-flag-tests:
    name: "Feature - ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "NUMA"
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_ENABLE_NUMA=ON"
            extra_deps: ""
          - name: "memkind"
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_ENABLE_MEMKIND=ON"
            extra_deps: "--with-memkind"
          - name: "mimalloc-OFF"
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_ENABLE_MIMALLOC=OFF"
            extra_deps: ""
          - name: "mimalloc-stats"
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_ENABLE_MIMALLOC=ON -DMEMORY_ENABLE_MIMALLOC_STATS=ON"
            extra_deps: ""
          - name: "shared-libs"
            os: ubuntu-latest
            extra_cmake: "-DBUILD_SHARED_LIBS=ON"
            extra_deps: ""
          - name: "magic_enum-OFF"
            os: ubuntu-latest
            extra_cmake: "-DCORE_ENABLE_MAGICENUM=OFF"
            extra_deps: ""
          - name: "examples"
            os: ubuntu-latest
            extra_cmake: "-DCORE_ENABLE_EXAMPLES=ON -DMEMORY_ENABLE_EXAMPLES=ON -DLOGGING_ENABLE_EXAMPLES=ON -DVECTORIZATION_ENABLE_EXAMPLES=ON -DPARALLEL_ENABLE_EXAMPLES=ON -DPROFILER_ENABLE_EXAMPLES=ON -DMODELS_ENABLE_EXAMPLES=ON"
            extra_deps: ""
          - name: "packet-size-8"
            os: ubuntu-latest
            extra_cmake: "-DVECTORIZATION_PACKET_SIZE=8 -DVECTORIZATION_CPU_BACKEND=avx2"
            extra_deps: ""
          - name: "sleef"
            os: ubuntu-24.04-arm
            extra_cmake: "-DVECTORIZATION_ENABLE_SLEEF=ON -DVECTORIZATION_CPU_BACKEND=neon"
            extra_deps: ""
          - name: "accelerate"
            os: macos-latest
            extra_cmake: "-DVECTORIZATION_ENABLE_ACCELERATE=ON -DVECTORIZATION_CPU_BACKEND=neon"
            extra_deps: ""
          - name: "lto-thin"
            os: ubuntu-latest
            extra_cmake: "-DCORE_LTO_MODE=thin -DMEMORY_LTO_MODE=thin -DLOGGING_LTO_MODE=thin -DVECTORIZATION_LTO_MODE=thin -DPARALLEL_LTO_MODE=thin -DPROFILER_LTO_MODE=thin"
            extra_deps: ""
          - name: "lto-full"
            os: ubuntu-latest
            extra_cmake: "-DCORE_LTO_MODE=full -DMEMORY_LTO_MODE=full -DLOGGING_LTO_MODE=full -DVECTORIZATION_LTO_MODE=full -DPARALLEL_LTO_MODE=full -DPROFILER_LTO_MODE=full"
            extra_deps: ""
          - name: "ccache"
            os: ubuntu-latest
            extra_cmake: "-DCORE_CACHE_BACKEND=ccache -DMEMORY_CACHE_BACKEND=ccache -DLOGGING_CACHE_BACKEND=ccache -DVECTORIZATION_CACHE_BACKEND=ccache -DPARALLEL_CACHE_BACKEND=ccache -DPROFILER_CACHE_BACKEND=ccache"
            extra_deps: ""
          - name: "linker-lld"
            os: ubuntu-latest
            extra_cmake: "-DCORE_LINKER_CHOICE=lld -DMEMORY_LINKER_CHOICE=lld -DLOGGING_LINKER_CHOICE=lld -DVECTORIZATION_LINKER_CHOICE=lld -DPARALLEL_LINKER_CHOICE=lld -DPROFILER_LINKER_CHOICE=lld"
            extra_deps: ""
          - name: "memory-profiler-off"
            os: ubuntu-latest
            extra_cmake: "-DMEMORY_ENABLE_PROFILER=OFF"
            extra_deps: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb ${{ matrix.extra_deps }}

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x .github/workflows/install/install-deps-macos.sh
        ./.github/workflows/install/install-deps-macos.sh --with-tbb

    - name: Setup macOS linker environment
      if: runner.os == 'macOS'
      run: |
        echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    - name: Configure
      shell: bash
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=LOGURU \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON \
          ${{ matrix.extra_cmake }}

    - name: Build
      run: cmake --build build -j 2

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j 2

  # ============================================================================
  # Windows Visual Studio 2022 generator + Bazel Windows build
  # ============================================================================
  windows-vs22-tests:
    name: "Windows VS2022 - C++17 Release"
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      shell: pwsh
      run: |
        & .\.github\workflows\install\install-deps-windows.ps1

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Configure (MSVC)
      shell: pwsh
      run: |
        $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
        if (-not (Test-Path $vswhere)) {
          throw "vswhere.exe not found; Visual Studio Installer is missing on this runner"
        }
        $vs17 = (& $vswhere -latest -products * -version "[17.0,18.0)" `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath)
        if ($vs17) {
          $vsInstance = ([string]$vs17).Trim()
          Write-Host "Using Visual Studio 2022 at $vsInstance"
          cmake -B build -S . `
            -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_GENERATOR_INSTANCE=$vsInstance" `
            -DCMAKE_CXX_STANDARD=17 `
            -DLOGGING_BACKEND=NATIVE `
            -DBUILD_TESTING=ON `
            -DPARALLEL_ENABLE_TBB=OFF `
            -DMEMORY_ENABLE_TBB=OFF `
            -DCORE_ENABLE_BENCHMARK=OFF `
            -DMEMORY_ENABLE_BENCHMARK=OFF `
            -DLOGGING_ENABLE_BENCHMARK=OFF `
            -DVECTORIZATION_ENABLE_BENCHMARK=OFF `
            -DPARALLEL_ENABLE_BENCHMARK=OFF `
            -DPROFILER_ENABLE_BENCHMARK=OFF
        } else {
          # windows-latest now ships VS 18 Enterprise; CMake's "Visual Studio 17 2022"
          # generator cannot target it. Ninja + the MSVC env from msvc-dev-cmd covers
          # the same toolchain without depending on a matching VS generator name.
          Write-Host "VS 2022 not found; configuring Ninja with the active MSVC toolchain"
          cmake -B build -S . `
            -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_CXX_STANDARD=17 `
            -DLOGGING_BACKEND=NATIVE `
            -DBUILD_TESTING=ON `
            -DPARALLEL_ENABLE_TBB=OFF `
            -DMEMORY_ENABLE_TBB=OFF `
            -DCORE_ENABLE_BENCHMARK=OFF `
            -DMEMORY_ENABLE_BENCHMARK=OFF `
            -DLOGGING_ENABLE_BENCHMARK=OFF `
            -DVECTORIZATION_ENABLE_BENCHMARK=OFF `
            -DPARALLEL_ENABLE_BENCHMARK=OFF `
            -DPROFILER_ENABLE_BENCHMARK=OFF
        }

    - name: Build
      run: cmake --build build --config Release -j 2

    - name: Test
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure --build-config Release -j 2

  bazel-windows-tests:
    name: "Bazel - Windows"
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-windows-default-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Bazel build + test (default config)
      working-directory: Scripts
      shell: pwsh
      run: python setup_bazel.py config.build.test

  # ============================================================================
  # Static analysis — clang-tidy (check only) + Valgrind
  # ============================================================================
  clang-tidy-tests:
    name: "clang-tidy"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    - name: Configure with clang-tidy
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=NATIVE \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_CLANGTIDY=ON \
          -DMEMORY_ENABLE_CLANGTIDY=ON \
          -DLOGGING_ENABLE_CLANGTIDY=ON \
          -DVECTORIZATION_ENABLE_CLANGTIDY=ON \
          -DPARALLEL_ENABLE_CLANGTIDY=ON \
          -DPROFILER_ENABLE_CLANGTIDY=ON \
          -DMODELS_ENABLE_CLANGTIDY=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF

    - name: Build (clang-tidy runs as part of compile)
      run: cmake --build build -j 2

  valgrind-tests:
    name: "Valgrind"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb
        sudo apt-get install -y valgrind

    - name: Configure with Valgrind
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=NATIVE \
          -DBUILD_TESTING=ON \
          -DMEMORY_ENABLE_MIMALLOC=OFF \
          -DCORE_ENABLE_VALGRIND=ON \
          -DMEMORY_ENABLE_VALGRIND=ON \
          -DLOGGING_ENABLE_VALGRIND=ON \
          -DVECTORIZATION_ENABLE_VALGRIND=ON \
          -DPARALLEL_ENABLE_VALGRIND=ON \
          -DPROFILER_ENABLE_VALGRIND=ON \
          -DMODELS_ENABLE_VALGRIND=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF

    - name: Build
      run: cmake --build build -j 2

    - name: Test under Valgrind
      working-directory: ${{ github.workspace }}/build
      run: ctest --output-on-failure -j 1

  cppcheck-tests:
    name: "cppcheck"
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb
        sudo apt-get install -y cppcheck

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6 psutil==6.1.1

    - name: Configure, build, and run cppcheck
      working-directory: Scripts
      run: python3 setup.py config.build.cppcheck.ninja.clang

  # ============================================================================
  # Bazel feature-flag counterparts (NUMA, AVX2, GCC, MSAN).
  # SLEEF is CMake-only until Bazel grows a native SLEEF codegen path.
  # ============================================================================
  bazel-feature-flag-tests:
    name: "Bazel Feature - ${{ matrix.name }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "numa"
            os: ubuntu-latest
            extra: "numa"
          # Bazel --config=sleef requires a prior CMake SLEEF build
          # (see @@sleef_cmake//:sleef_missing). Covered by CMake Feature - sleef.
          - name: "avx2"
            os: ubuntu-latest
            extra: "avx2"
          - name: "gcc"
            os: ubuntu-latest
            extra: "gcc"
          - name: "msan"
            os: ubuntu-latest
            extra: "msan"

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Setup Bazel
      uses: bazel-contrib/setup-bazel@0.8.1
      with:
        bazelisk-cache: true
        disk-cache: bazel-feature-${{ matrix.name }}-${{ env.CACHE_VERSION }}
        repository-cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Python dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install colorama==0.4.6

    - name: Install NUMA headers
      if: matrix.name == 'numa'
      run: sudo apt-get update && sudo apt-get install -y libnuma-dev

    - name: Bazel build + test (${{ matrix.name }})
      working-directory: Scripts
      run: |
        if [ "${{ matrix.name }}" = "msan" ]; then
          echo "MSAN is compile-only on hosted runners (uninstrumented libstdc++)."
          python3 setup_bazel.py config.build.msan
          exit 0
        fi
        python3 setup_bazel.py config.build.test.${{ matrix.extra }}

