          -DCORE_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DMEMORY_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DLOGGING_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DVECTORIZATION_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DPARALLEL_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DPROFILER_ENABLE_LTO=${{ matrix.lto_enabled }} \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON

    - name: Build
