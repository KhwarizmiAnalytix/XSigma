  # ============================================================================
  # Link Time Optimization (LTO) Testing
  # Tests LTO enabled and disabled scenarios to ensure correct behavior
  # ============================================================================
  lto-tests:
    name: LTO - ${{ matrix.lto_enabled }}
    runs-on: ubuntu-latest

