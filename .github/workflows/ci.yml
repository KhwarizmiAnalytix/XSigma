name: XSigma CI - Streamlined Testing Pipeline

# This CI pipeline provides comprehensive testing for XSigma across multiple platforms and configurations.
# Key features:
# - C++17 baseline testing across all platforms (Ubuntu, Windows, macOS)
# - Selective C++20/C++23 testing with specific TBB/CUDA combinations
# - TBB support for Unix/macOS only (Windows TBB tested separately with Visual Studio)
# - CUDA integration across all platforms where supported
# - Sanitizer testing restricted to Unix-based systems for better compatibility
# - Streamlined job matrix to reduce CI time while maintaining comprehensive coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CACHE_VERSION: v3  # v3: invalidate caches from the Hisab repo rename (absolute CMakeCache paths)
  SCCACHE_VERSION: "0.7.7"  # Version of sccache to use
  BUILDCACHE_VERSION: "0.28.4"  # Version of buildcache to use on Windows

jobs:
  # ============================================================================
  # Primary Build Matrix - C++17 Baseline Testing
  # Tests core functionality with C++17 across all platforms and build types
  # Windows: No TBB (tested separately), CUDA enabled where available
  # Unix/macOS: Both TBB enabled/disabled, CUDA enabled where available
  # ============================================================================
  build-matrix:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== C++17 Baseline Testing (Primary) =====
          # Ubuntu C++17 - Debug and Release with TBB variants
          - name: "Ubuntu C++17 Debug - LOGURU - TBB:ON"
            os: ubuntu-latest
            build_type: Debug
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          - name: "Ubuntu C++17 Debug - NATIVE - TBB:OFF"
            os: ubuntu-latest
            build_type: Debug
            cxx_std: 17
            logging_backend: NATIVE
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          - name: "Ubuntu C++17 Release - GLOG - TBB:ON"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: GLOG
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          # Windows C++17 - Debug and Release (no TBB, CUDA where available)
          # Temporarily disabled - CUDA testing
          # - name: "Windows C++17 Debug - LOGURU - CUDA:ON"
          #   os: windows-latest
          #   build_type: Debug
          #   cxx_std: 17
          #   logging_backend: LOGURU
          #   tbb_enabled: OFF
          #   cuda_enabled: ON
          #   compiler_c: clang
          #   compiler_cxx: clang
          #   generator: Ninja
          #   cache_path: ~/AppData/Local/Temp/chocolatey

          - name: "Windows C++17 Release - NATIVE - TBB:OFF"
            os: windows-latest
            build_type: Release
            cxx_std: 17
            logging_backend: NATIVE
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/AppData/Local/Temp/chocolatey

          - name: "Windows C++17 Debug - LOGURU - TBB:ON"
            os: windows-latest
            build_type: Debug
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/AppData/Local/Temp/chocolatey

          - name: "Windows C++20 Release - LOGURU - TBB:OFF"
            os: windows-latest
            build_type: Release
            cxx_std: 20
            logging_backend: LOGURU
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/AppData/Local/Temp/chocolatey

          - name: "Ubuntu C++17 Release - GCC - TBB:ON"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: gcc
            compiler_cxx: gcc
            generator: Ninja
            cache_path: ~/.cache

          - name: "Ubuntu C++17 Release - SPDLOG - TBB:ON"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 17
            logging_backend: SPDLOG
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          # macOS C++17 - Debug and Release with TBB variants
          - name: "macOS C++17 Debug - LOGURU - TBB:ON"
            os: macos-latest
            build_type: Debug
            cxx_std: 17
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF  # CUDA not officially supported on Apple Silicon
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/Library/Caches

          - name: "macOS C++17 Release - GLOG - TBB:OFF"
            os: macos-latest
            build_type: Release
            cxx_std: 17
            logging_backend: GLOG
            tbb_enabled: OFF
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/Library/Caches

          # ===== C++20 Targeted Testing (Release only) =====
          - name: "Ubuntu C++20 Release - TBB:ON"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 20
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          # Temporarily disabled - CUDA testing
          # - name: "Ubuntu C++20 Release - CUDA:ON"
          #   os: ubuntu-latest
          #   build_type: Release
          #   cxx_std: 20
          #   logging_backend: NATIVE
          #   tbb_enabled: OFF
          #   cuda_enabled: ON
          #   compiler_c: clang
          #   compiler_cxx: clang
          #   generator: Ninja
          #   cache_path: ~/.cache

          # Temporarily disabled - CUDA testing
          # - name: "Windows C++20 Release - CUDA:ON"
          #   os: windows-latest
          #   build_type: Release
          #   cxx_std: 20
          #   logging_backend: LOGURU
          #   tbb_enabled: OFF
          #   cuda_enabled: ON
          #   compiler_c: clang
          #   compiler_cxx: clang
          #   generator: Ninja
          #   cache_path: ~/AppData/Local/Temp/chocolatey

          - name: "macOS C++20 Release - TBB:ON"
            os: macos-latest
            build_type: Release
            cxx_std: 20
            logging_backend: LOGURU
            tbb_enabled: ON
            cuda_enabled: OFF  # CUDA not supported on Apple Silicon
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/Library/Caches

          # ===== C++23 Targeted Testing (Release only) =====
          - name: "Ubuntu C++23 Release - TBB:ON"
            os: ubuntu-latest
            build_type: Release
            cxx_std: 23
            logging_backend: GLOG
            tbb_enabled: ON
            cuda_enabled: OFF
            compiler_c: clang
            compiler_cxx: clang
            generator: Ninja
            cache_path: ~/.cache

          # Temporarily disabled - CUDA testing
          # - name: "Windows C++23 Release - CUDA:ON"
          #   os: windows-latest
          #   build_type: Release
          #   cxx_std: 23
          #   logging_backend: NATIVE
          #   tbb_enabled: OFF
          #   cuda_enabled: ON
          #   compiler_c: clang
          #   compiler_cxx: clang
          #   generator: Ninja
          #   cache_path: ~/AppData/Local/Temp/chocolatey

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ${{ matrix.cache_path }}
          build/ThirdParty
        key: ${{ runner.os }}-deps-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'ThirdParty/**') }}
        restore-keys: |
          ${{ runner.os }}-deps-${{ env.CACHE_VERSION }}-

    # ===== Install Dependencies Using Scripts =====
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        chmod +x .github/workflows/install/install-deps-macos.sh
        ./.github/workflows/install/install-deps-macos.sh --with-tbb

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if ("${{ matrix.tbb_enabled }}" -eq "ON") {
          & .\.github\workflows\install\install-deps-windows.ps1 -WithTbb
        } else {
          & .\.github\workflows\install\install-deps-windows.ps1
        }

    - name: Setup macOS linker environment
      if: runner.os == 'macOS'
      run: |
        # Set up linker flags for Homebrew LLVM libc++
        # This fixes the missing std::__1::__hash_memory symbol issue
        echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    # Temporarily disabled - CUDA testing
    # - name: Install CUDA Toolkit (Windows)
    #   if: runner.os == 'Windows' && matrix.cuda_enabled == 'ON'
    #   shell: pwsh
    #   run: |
    #     # Install NVIDIA CUDA Toolkit for Windows
    #     Write-Host "=== Installing CUDA Toolkit for Windows ==="
    #
    #     # Try chocolatey installation first
    #     Write-Host "Attempting CUDA installation via chocolatey..."
    #     try {
    #       choco install cuda --version=12.3.0 -y --no-progress --timeout=600
    #       if ($LASTEXITCODE -eq 0) {
    #         Write-Host "SUCCESS: CUDA Toolkit installed via chocolatey"
    #
    #         # Verify installation
    #         $nvccPath = Get-Command nvcc -ErrorAction SilentlyContinue
    #         if ($nvccPath) {
    #           Write-Host "CUDA compiler found at: $($nvccPath.Source)"
    #           & nvcc --version
    #         } else {
    #           Write-Host "WARNING: nvcc not found in PATH after installation"
    #         }
    #       } else {
    #         throw "Chocolatey installation returned non-zero exit code"
    #       }
    #     } catch {
    #       Write-Host "WARNING: CUDA installation via chocolatey failed: $_"
    #       Write-Host "Attempting direct download from NVIDIA..."
    #
    #       try {
    #         # Fallback: Direct download from NVIDIA
    #         $cudaUrl = "https://developer.download.nvidia.com/compute/cuda/12.3.0/network_installers/cuda_12.3.0_windows_network.exe"
    #         $installerPath = "$env:TEMP\cuda_installer.exe"
    #
    #         Write-Host "Downloading CUDA installer..."
    #         Invoke-WebRequest -Uri $cudaUrl -OutFile $installerPath -TimeoutSec 300
    #
    #         Write-Host "Running CUDA installer (silent mode)..."
    #         Start-Process -FilePath $installerPath -ArgumentList "-s" -Wait -NoNewWindow
    #
    #         if ($LASTEXITCODE -eq 0) {
    #           Write-Host "SUCCESS: CUDA installed via direct download"
    #         } else {
    #           throw "Direct installer returned non-zero exit code"
    #         }
    #       } catch {
    #         Write-Host "WARNING: Direct CUDA installation also failed: $_"
    #         Write-Host "Build will continue without CUDA support"
    #         Write-Host "This is non-fatal - CUDA is optional for this build configuration"
    #       }
    #     }
    #
    #     # Final verification
    #     Write-Host "`n=== CUDA Installation Summary ==="
    #     if (Get-Command nvcc -ErrorAction SilentlyContinue) {
    #       Write-Host "Status: CUDA available"
    #       & nvcc --version
    #     } else {
    #       Write-Host "Status: CUDA not available (build will continue without CUDA)"
    #     }

    - name: Install Intel MKL (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Intel MKL installation on Windows
        Write-Host "Intel MKL installation for Windows..."
        Write-Host "Note: Intel MKL can be installed via Intel oneAPI installer or vcpkg"
        Write-Host "For CI purposes, using system math libraries"
        Write-Host "To install MKL: vcpkg install intel-mkl:x64-windows (if available)"
        Write-Host "Or download Intel oneAPI Base Toolkit from Intel website"

    # ===== Python Setup =====
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil==6.1.1 colorama==0.4.6

    # ===== Verify Code Quality Tools Installation =====
    - name: Verify code quality tools (Unix only)
      if: runner.os != 'Windows'
      run: |
        echo "=== Verifying Code Quality Tools Installation ==="
        if [ "${{ runner.os }}" = "Linux" ]; then
          echo "Valgrind version:"
          valgrind --version || echo "Valgrind not available"
          echo ""
          echo "NUMA library check:"
          ldconfig -p | grep numa || echo "NUMA libraries not found"
          echo ""
        fi
        echo "Cppcheck version:"
        cppcheck --version || echo "Cppcheck not available"
        echo ""
        echo "Tools verification complete"

    # ===== Build Configuration and Execution Using CMake =====
    - name: Export Unix/macOS build environment
      if: runner.os != 'Windows'
      run: |
        if [ "${{ matrix.compiler_cxx }}" = "clang" ]; then
          echo "CC_COMPILER=clang" >> "$GITHUB_ENV"
          echo "CXX_COMPILER=clang++" >> "$GITHUB_ENV"
        else
          echo "CC_COMPILER=${{ matrix.compiler_cxx }}" >> "$GITHUB_ENV"
          echo "CXX_COMPILER=g++" >> "$GITHUB_ENV"
        fi
        BUILD_DIR="build_ninja"
        if [ "${{ matrix.tbb_enabled }}" = "ON" ]; then
          BUILD_DIR="${BUILD_DIR}_tbb"
        fi
        if [ "${{ matrix.cxx_std }}" != "17" ]; then
          BUILD_DIR="${BUILD_DIR}_cxx${{ matrix.cxx_std }}"
        fi
        echo "BUILD_DIR=$BUILD_DIR" >> "$GITHUB_ENV"

    - name: Configure (Unix/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B "$BUILD_DIR" \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=$CC_COMPILER \
          -DCMAKE_CXX_COMPILER=$CXX_COMPILER \
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }} \
          -DLOGGING_BACKEND=${{ matrix.logging_backend }} \
          -DBUILD_TESTING=ON \
          -DPARALLEL_ENABLE_TBB=${{ matrix.tbb_enabled }} \
          -DMEMORY_ENABLE_TBB=${{ matrix.tbb_enabled }} \
          -DMEMORY_ENABLE_CUDA=${{ matrix.cuda_enabled }}

    - name: Build (Unix/macOS)
      if: runner.os != 'Windows'
      run: cmake --build "$BUILD_DIR" -j 2

    - name: Test (Unix/macOS)
      if: runner.os != 'Windows'
      run: |
        # Vendored libsvml.so needs libintlc.so.5; the .so has no RPATH, so
        # GCC (which auto-enables ThirdParty SVML) fails without this.
        if [ -f ThirdParty/svml/unix/lib/libintlc.so.5 ]; then
          export LD_LIBRARY_PATH="${PWD}/ThirdParty/svml/unix/lib:${BUILD_DIR}/lib:${LD_LIBRARY_PATH:-}"
        fi
        ctest --test-dir "$BUILD_DIR" --output-on-failure -j 2

    - name: Configure and Build (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        # Determine build directory name
        $buildDir = "build_ninja"
        if ("${{ matrix.tbb_enabled }}" -eq "ON") {
          $buildDir = "$buildDir`_tbb"
        }
        if ("${{ matrix.cxx_std }}" -ne "17") {
          $buildDir = "$buildDir`_cxx${{ matrix.cxx_std }}"
        }

        # Configure CMake
        cmake -B "$buildDir" `
          -S . `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
          -DCMAKE_C_COMPILER=clang `
          -DCMAKE_CXX_COMPILER=clang++ `
          -DCMAKE_CXX_STANDARD=${{ matrix.cxx_std }} `
          -DLOGGING_BACKEND=${{ matrix.logging_backend }} `
          -DBUILD_TESTING=ON `
          -DPARALLEL_ENABLE_TBB=${{ matrix.tbb_enabled }} `
          -DMEMORY_ENABLE_TBB=${{ matrix.tbb_enabled }} `
          -DMEMORY_ENABLE_CUDA=${{ matrix.cuda_enabled }}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Build
        cmake --build "$buildDir" -j 2
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        # Run tests
        ctest --test-dir "$buildDir" --output-on-failure -j 2
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Verify Build Configuration
      shell: bash
      run: |
        # Determine build directory name (same logic as build steps)
        BUILD_DIR="build_ninja"
        if [ "${{ matrix.tbb_enabled }}" = "ON" ]; then
          BUILD_DIR="${BUILD_DIR}_tbb"
        fi
        if [ "${{ matrix.cxx_std }}" != "17" ]; then
          BUILD_DIR="${BUILD_DIR}_cxx${{ matrix.cxx_std }}"
        fi

        echo "=== Build Configuration Verification ==="
        echo "Platform: ${{ runner.os }}"
        echo "Build Directory: $BUILD_DIR"
        echo "C++ Standard: ${{ matrix.cxx_std }}"
        echo "Build Type: ${{ matrix.build_type }}"
        echo "Logging Backend: ${{ matrix.logging_backend }}"
        echo "TBB Enabled: ${{ matrix.tbb_enabled }}"
        echo "CUDA Enabled: ${{ matrix.cuda_enabled }}"
        echo ""

        # Verify core library was built successfully
        if [ "${{ runner.os }}" = "Linux" ]; then
          if [ -f "$BUILD_DIR/Library/Core/libCore.so" ] || [ -f "$BUILD_DIR/Library/Core/libCore.a" ]; then
            echo "SUCCESS: Core library built successfully (Linux)"
            # Check TBB linkage if enabled
            if [ "${{ matrix.tbb_enabled }}" = "ON" ] && [ -f "$BUILD_DIR/Library/Core/libCore.so" ]; then
              if ldd $BUILD_DIR/Library/Core/libCore.so | grep -q "tbb"; then
                echo "SUCCESS: TBB dependencies found in Core library"
              else
                echo "INFO: TBB may be statically linked or not found"
              fi
            fi
          else
            echo "WARNING: Core library not found (Linux)"
          fi
        elif [ "${{ runner.os }}" = "macOS" ]; then
          if [ -f "$BUILD_DIR/Library/Core/libCore.dylib" ] || [ -f "$BUILD_DIR/Library/Core/libCore.a" ]; then
            echo "SUCCESS: Core library built successfully (macOS)"
            # Check TBB linkage if enabled
            if [ "${{ matrix.tbb_enabled }}" = "ON" ] && [ -f "$BUILD_DIR/Library/Core/libCore.dylib" ]; then
              if otool -L $BUILD_DIR/Library/Core/libCore.dylib | grep -q "tbb"; then
                echo "SUCCESS: TBB dependencies found in Core library"
              else
                echo "INFO: TBB may be statically linked or not found"
              fi
            fi
          else
            echo "WARNING: Core library not found (macOS)"
          fi
        elif [ "${{ runner.os }}" = "Windows" ]; then
          if [ -f "$BUILD_DIR/Library/Core/Core.dll" ] || [ -f "$BUILD_DIR/Library/Core/Core.lib" ]; then
            echo "SUCCESS: Core library built successfully (Windows)"
            echo "INFO: Windows TBB testing is handled separately with Visual Studio"
          else
            echo "WARNING: Core library not found (Windows)"
          fi
        fi

    - name: Prepare test results artifact name
      if: failure()
      shell: bash
      run: |
        # upload-artifact rejects: " : < > | * ? CR LF \ /
        raw='${{ matrix.name }}'
        safe=$(printf '%s' "$raw" | tr -d '\015\012' | tr ':"<>|*?/' '-' | tr '\\' '-' | tr '"' '-' | tr -s '-')
        echo "TEST_RESULTS_ARTIFACT_NAME=test-results-${safe}" >> "$GITHUB_ENV"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.TEST_RESULTS_ARTIFACT_NAME }}
        path: |
          build*/Testing/Temporary/LastTest.log
          build*/**/*.log

  # ============================================================================
  # TBB-Specific Testing - Unix/macOS Only
  # Focused TBB functionality tests for platforms where TBB is officially supported
  # Windows TBB testing is handled separately with Visual Studio builds
  # ============================================================================
  tbb-specific-tests:
    name: TBB Functionality - ${{ matrix.os }} - ${{ matrix.build_type }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows removed - TBB tested separately
        build_type: [Debug, Release]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          ~/Library/Caches
          build/ThirdParty
        key: ${{ runner.os }}-tbb-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-tbb-${{ env.CACHE_VERSION }}-

    # ===== Ubuntu TBB Dependencies =====
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ninja-build \
          clang \
          llvm \
          cmake \
          python3 \
          python3-pip \
          libtbb-dev \
          valgrind \
          cppcheck \
          libnuma-dev \
          sccache

    - name: Install Intel TBB (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
        echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
        sudo apt-get update
        sudo apt-get install -y intel-oneapi-tbb-devel

    # ===== macOS TBB Dependencies =====
    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ninja llvm cmake python3 tbb cppcheck sccache

    - name: Setup macOS linker environment (TBB tests)
      if: runner.os == 'macOS'
      run: |
        # Set up linker flags for Homebrew LLVM libc++
        echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    # ===== Python Setup =====
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil==6.1.1 colorama==0.4.6

    # ===== CMake Configuration for TBB Testing =====
    - name: Configure with TBB enabled
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=LOGURU \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_CUDA=OFF

    # ===== Build and Test TBB Functionality =====
    - name: Build
      run: cmake --build build -j 2

    - name: Run TBB-specific tests
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        # Run all tests with focus on TBB-related functionality
        ctest --output-on-failure -j 2

    - name: Verify TBB Integration
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        echo "=== Verifying TBB Integration ==="
        echo "Platform: ${{ runner.os }}"
        echo "Build Type: ${{ matrix.build_type }}"

        # Platform-specific TBB verification
        if [ "${{ runner.os }}" = "Linux" ]; then
          if [ -f "Library/Core/libCore.so" ]; then
            echo "SUCCESS: Core library built successfully (Linux)"
            if ldd Library/Core/libCore.so | grep -q "tbb"; then
              echo "SUCCESS: TBB dependencies found in Core library"
            else
              echo "INFO: TBB may be statically linked"
            fi
          else
            echo "WARNING: Core library not found (Linux)"
          fi
        elif [ "${{ runner.os }}" = "macOS" ]; then
          if [ -f "Library/Core/libCore.dylib" ]; then
            echo "SUCCESS: Core library built successfully (macOS)"
            if otool -L Library/Core/libCore.dylib | grep -q "tbb"; then
              echo "SUCCESS: TBB dependencies found in Core library"
            else
              echo "INFO: TBB may be statically linked"
            fi
          else
            echo "WARNING: Core library not found (macOS)"
          fi
        fi

    - name: Upload TBB test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: tbb-test-results-${{ matrix.os }}-${{ matrix.build_type }}
        path: |
          build/Testing/Temporary/LastTest.log
          build/**/*.log

  # ============================================================================
  # Sanitizer Testing - Unix Systems Only
  # Sanitizers work best on Unix-based systems with Clang
  # Windows sanitizer support is limited and tested separately
  # ============================================================================
  sanitizer-tests:
    name: Sanitizer ${{ matrix.sanitizer }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # Windows removed for better compatibility
        sanitizer: [address, undefined, thread]
        exclude:
          # LeakSanitizer is not supported on Apple Silicon (ARM64)
          - os: macos-latest
            sanitizer: leak
          # ThreadSanitizer is disabled on macOS: Homebrew LLVM's tsan runtime
          # crashes at process startup (SIGSEGV in __tsan::SlotLock) on current
          # macOS/Apple Silicon runners, before any test code executes.
          - os: macos-latest
            sanitizer: thread
        include:
          # Add leak sanitizer only for Ubuntu where it's supported
          - os: ubuntu-latest
            sanitizer: leak
          # MemorySanitizer is Clang-only and needs an instrumented libc++; Ubuntu only
          - os: ubuntu-latest
            sanitizer: memory

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          ~/Library/Caches
          build/ThirdParty
        key: ${{ runner.os }}-sanitizer-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ${{ runner.os }}-sanitizer-${{ env.CACHE_VERSION }}-

    # ===== Ubuntu Sanitizer Dependencies =====
    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ninja-build \
          clang \
          llvm \
          cmake \
          python3 \
          python3-pip \
          libtbb-dev \
          valgrind \
          cppcheck \
          libnuma-dev \
          sccache

    # ===== macOS Sanitizer Dependencies =====
    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew install ninja cmake llvm tbb cppcheck sccache
        echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH

    - name: Setup macOS linker environment (Sanitizer tests)
      if: matrix.os == 'macos-latest'
      run: |
        # Set up linker flags for Homebrew LLVM libc++
        echo "LDFLAGS=-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib -Wl,-rpath,/opt/homebrew/opt/llvm/lib/c++ -Wl,-rpath,/opt/homebrew/opt/llvm/lib" >> $GITHUB_ENV
        echo "CPPFLAGS=-I/opt/homebrew/opt/llvm/include" >> $GITHUB_ENV

    # ===== Python Setup =====
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil==6.1.1 colorama==0.4.6

    # ===== CMake Configuration for Sanitizer Testing =====
    - name: Configure with ${{ matrix.sanitizer }} sanitizer
      shell: bash
      run: |
        # Use NATIVE logging backend for sanitizer builds to avoid threading/memory issues
        cmake -B build -S . -G Ninja \
          -C .github/cmake/configure_cache.cmake \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DLOGGING_BACKEND=NATIVE \
          -DCORE_ENABLE_SANITIZER=ON \
          -DCORE_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DMEMORY_ENABLE_SANITIZER=ON \
          -DMEMORY_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DLOGGING_ENABLE_SANITIZER=ON \
          -DLOGGING_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DVECTORIZATION_ENABLE_SANITIZER=ON \
          -DVECTORIZATION_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DPARALLEL_ENABLE_SANITIZER=ON \
          -DPARALLEL_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DPROFILER_ENABLE_SANITIZER=ON \
          -DPROFILER_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DMODELS_ENABLE_SANITIZER=ON \
          -DMODELS_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DGRAPH_ENABLE_SANITIZER=ON \
          -DGRAPH_SANITIZER_TYPE=${{ matrix.sanitizer }} \
          -DBUILD_TESTING=ON \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_CUDA=OFF

    - name: Build
      run: cmake --build build -j 2

    - name: Setup sanitizer environment
      shell: bash
      run: |
        # Set up sanitizer-specific environment variables
        case "${{ matrix.sanitizer }}" in
          "address")
            echo "ASAN_OPTIONS=print_stacktrace=1:check_initialization_order=1:strict_init_order=1:suppressions=${{ github.workspace }}/Scripts/suppressions/asan_suppressions.txt" >> $GITHUB_ENV
            ;;
          "leak")
            echo "LSAN_OPTIONS=print_suppressions=0:suppressions=${{ github.workspace }}/Scripts/suppressions/lsan_suppressions.txt" >> $GITHUB_ENV
            ;;
          "thread")
            echo "TSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/Scripts/suppressions/tsan_suppressions.txt" >> $GITHUB_ENV
            ;;
          "undefined")
            echo "UBSAN_OPTIONS=print_stacktrace=1:halt_on_error=1:suppressions=${{ github.workspace }}/Scripts/suppressions/ubsan_suppressions.txt" >> $GITHUB_ENV
            ;;
          "memory")
            echo "MSAN_OPTIONS=print_stats=1:halt_on_error=1:suppressions=${{ github.workspace }}/Scripts/suppressions/msan_suppressions.txt" >> $GITHUB_ENV
            ;;
        esac

    - name: Run Tests with ${{ matrix.sanitizer }} Sanitizer
      working-directory: ${{ github.workspace }}/build
      run: |
        if [ "${{ matrix.sanitizer }}" = "memory" ]; then
          echo "MSAN is compile-only on hosted runners (uninstrumented libstdc++)."
          exit 0
        fi
        ctest --output-on-failure -j 2

    - name: Upload sanitizer results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: sanitizer-${{ matrix.sanitizer }}-${{ matrix.os }}-results
        path: |
          build/Testing/Temporary/LastTest.log
          build/**/*.log



  # ============================================================================
  # Per-Project Flag + Backend Matrix Testing
  # Validates each library project under feature flag ON/OFF and backend variants
  # ============================================================================
  project-flag-backend-tests:
    name: "Project Matrix - ${{ matrix.project }} - ${{ matrix.external }} - ${{ matrix.backend_label }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: Core
            external: "ON"
            backend_label: default
            extra_cmake_flags: ""
          - project: Core
            external: "OFF"
            backend_label: default
            extra_cmake_flags: ""

          - project: Logging
            external: "ON"
            backend_label: LOGURU
            extra_cmake_flags: "-DLOGGING_BACKEND=LOGURU"
          - project: Logging
            external: "OFF"
            backend_label: NATIVE
            extra_cmake_flags: "-DLOGGING_BACKEND=NATIVE"
          - project: Logging
            external: "ON"
            backend_label: GLOG
            extra_cmake_flags: "-DLOGGING_BACKEND=GLOG"

          - project: Memory
            external: "ON"
            backend_label: default
            extra_cmake_flags: ""
          - project: Memory
            external: "OFF"
            backend_label: default
            extra_cmake_flags: ""

          - project: Parallel
            external: "ON"
            backend_label: std
            extra_cmake_flags: "-DPARALLEL_BACKEND=std"
          - project: Parallel
            external: "OFF"
            backend_label: openmp
            extra_cmake_flags: "-DPARALLEL_BACKEND=openmp"
          - project: Parallel
            external: "ON"
            backend_label: tbb
            extra_cmake_flags: "-DPARALLEL_BACKEND=tbb"

          - project: Profiler
            external: "OFF"
            backend_label: ITT
            extra_cmake_flags: "-DPROFILER_BACKEND=ITT"
          - project: Profiler
            external: "ON"
            backend_label: KINETO
            extra_cmake_flags: "-DPROFILER_BACKEND=KINETO"

          - project: Logging
            external: "ON"
            backend_label: SPDLOG
            extra_cmake_flags: "-DLOGGING_BACKEND=SPDLOG"

          - project: Vectorization
            external: "ON"
            backend_label: default
            extra_cmake_flags: ""
          - project: Vectorization
            external: "OFF"
            backend_label: default
            extra_cmake_flags: ""

          - project: Models
            external: "ON"
            backend_label: default
            extra_cmake_flags: ""
          - project: Models
            external: "OFF"
            backend_label: default
            extra_cmake_flags: ""

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          build/ThirdParty
        key: ubuntu-project-matrix-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt') }}
        restore-keys: |
          ubuntu-project-matrix-${{ env.CACHE_VERSION }}-

    - name: Install dependencies
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    - name: Configure
      shell: bash
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DXSIGMA_ENABLE_EXTERNAL=${{ matrix.external }} \
          -DXSIGMA_LIBRARY_PROJECT=${{ matrix.project }} \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_CUDA=OFF \
          ${{ matrix.extra_cmake_flags }}

    - name: Build
      run: cmake --build build -j 2

    - name: Run ${{ matrix.project }} tests
      shell: bash
      run: |
        regex=".*${{ matrix.project }}.*"
        if ctest --test-dir build -N -R "$regex" | grep -q "Total Tests: 0"; then
          echo "No project-specific test regex match found; running full test suite."
          ctest --test-dir build --output-on-failure -j 2
        else
          ctest --test-dir build --output-on-failure -R "$regex" -j 2
        fi

  # ============================================================================
  # Vectorization SIMD backend matrix (SSE, AVX-512, NEON, SVE)
  # x86 jobs: ubuntu-latest. AArch64 jobs: ubuntu-24.04-arm (requires public repo
  # or appropriate org plan for hosted ARM runners). AVX-512 is compiled whenever
  # the toolchain accepts -mavx512f; tests run only if the CPU has avx512f
  # (Scripts/helpers/cpu_isa.py). ubuntu-latest typically compiles but does not
  # execute AVX-512. CMake may still fall back to VECTORIZATION_CPU_BACKEND=no
  # if the compiler itself cannot emit the requested ISA.
  # ============================================================================
  vectorization-simd-backend-tests:
    name: "Vectorization ${{ matrix.vectorization_type }} — ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - vectorization_type: no
            os: ubuntu-latest
          - vectorization_type: sse
            os: ubuntu-latest
          - vectorization_type: avx
            os: ubuntu-latest
          - vectorization_type: avx2
            os: ubuntu-latest
          - vectorization_type: avx512
            os: ubuntu-latest
          - vectorization_type: neon
            os: ubuntu-24.04-arm
          - vectorization_type: sve
            os: ubuntu-24.04-arm

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache
          build/ThirdParty
        key: vec-simd-${{ matrix.vectorization_type }}-${{ env.CACHE_VERSION }}-${{ hashFiles('**/CMakeLists.txt', 'Library/Vectorization/**') }}
        restore-keys: |
          vec-simd-${{ matrix.vectorization_type }}-${{ env.CACHE_VERSION }}-

    - name: Install dependencies (Ubuntu)
      run: |
        chmod +x .github/workflows/install/install-deps-ubuntu.sh
        ./.github/workflows/install/install-deps-ubuntu.sh --with-tbb

    - name: Configure (Vectorization ${{ matrix.vectorization_type }})
      shell: bash
      run: |
        cmake -B build \
          -C .github/cmake/configure_cache.cmake \
          -S . \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_CXX_STANDARD=17 \
          -DVECTORIZATION_CPU_BACKEND=${{ matrix.vectorization_type }} \
          -DLOGGING_BACKEND=NATIVE \
          -DBUILD_TESTING=ON \
          -DCORE_ENABLE_BENCHMARK=OFF \
          -DMEMORY_ENABLE_BENCHMARK=OFF \
          -DLOGGING_ENABLE_BENCHMARK=OFF \
          -DVECTORIZATION_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_BENCHMARK=OFF \
          -DPROFILER_ENABLE_BENCHMARK=OFF \
          -DPARALLEL_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_TBB=ON \
          -DMEMORY_ENABLE_CUDA=OFF

    - name: Build
      run: cmake --build build -j 2

    - name: Test (Vectorization focus)
      working-directory: ${{ github.workspace }}/build
      shell: bash
      run: |
        if [ "${{ matrix.vectorization_type }}" = "avx512" ]; then
          if ! python3 "${{ github.workspace }}/Scripts/helpers/cpu_isa.py" avx512; then
            echo "AVX-512 build succeeded; this CPU has no avx512f. Skipping test execution."
            exit 0
          fi
        fi
        regex="Vectorization"
        if ctest -N -R "$regex" | grep -q "Total Tests: 0"; then
          echo "No tests matched '$regex'; running full suite."
          ctest --output-on-failure -j 2
        else
          ctest --output-on-failure -R "$regex" -j 2
        fi

    - name: Upload Vectorization SIMD test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: vectorization-simd-${{ matrix.vectorization_type }}-logs
        path: |
          build/Testing/Temporary/LastTest.log
          build/**/*.log

  # ============================================================================
  # Optimization Flags Testing
  # Tests different compiler optimization levels to ensure code works correctly
  # across various optimization settings (-O0, -O2, -O3)
  # ============================================================================
  optimization-flags-test:
    name: Optimization - ${{ matrix.opt_level }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        opt_level: ["-O0", "-O2", "-O3"]
